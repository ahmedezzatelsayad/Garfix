# ─────────────────────────────────────────────────────────────────────────────
# GarfiX — Local / Staging Observability Stack
# ─────────────────────────────────────────────────────────────────────────────
# Spin up with:  docker compose -f docker-compose.observability.yml up -d
# Tear down:     docker compose -f docker-compose.observability.yml down -v
#
# Jaeger UI:     http://localhost:16686
# OTLP/HTTP:     http://localhost:4318   (set OTEL_EXPORTER_OTLP_ENDPOINT)
# OTLP/gRPC:     http://localhost:4317   (set OTEL_EXPORTER_OTLP_PROTOCOL=grpc)
# ─────────────────────────────────────────────────────────────────────────────

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: garfix-jaeger
    restart: unless-stopped
    environment:
      # ── Collector protocols ──────────────────────────────────────────────
      COLLECTOR_OTLP_ENABLED: "true"

      # ── Memory backend (suitable for local / staging) ────────────────────
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: "/badger/data"
      BADGER_DIRECTORY_KEY:  "/badger/key"

      # ── Sampling ─────────────────────────────────────────────────────────
      # All traces are stored locally; no sampling at the collector level.
      SAMPLING_STRATEGIES_FILE: "/etc/jaeger/sampling-strategies.json"

      # ── Log level ────────────────────────────────────────────────────────
      LOG_LEVEL: "info"
    ports:
      # Jaeger UI
      - "16686:16686"
      # OTLP over HTTP (default for most SDKs)
      - "4318:4318"
      # OTLP over gRPC
      - "4317:4317"
      # Jaeger native protocols (optional — useful for legacy integrations)
      - "6831:6831/udp"   # Jaeger agent compact Thrift
      - "6832:6832/udp"   # Jaeger agent binary Thrift
      - "5778:5778"       # Jaeger agent configs
      - "14268:14268"     # Jaeger collector HTTP
      - "14250:14250"     # Jaeger collector gRPC
    volumes:
      - jaeger-badger-data:/badger
      - ./observability/jaeger-sampling-strategies.json:/etc/jaeger/sampling-strategies.json:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - garfix-observability

volumes:
  jaeger-badger-data:
    driver: local

networks:
  garfix-observability:
    driver: bridge
    name: garfix-observability
