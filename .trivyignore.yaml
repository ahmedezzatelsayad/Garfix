  # Next.js's file tracing is conservative, but the GarfiX server
  # process never invokes any sigstore API.

  - id: CVE-2026-48815
    status: wontfix
    severity: HIGH
    package:
      name: sigstore
    justification: >
      sigstore is a build-time-only dependency used by npm/bun for
      package signature verification during `bun install`. The GarfiX
      production server process never invokes any sigstore API — the
      package is present in the standalone output only because Next.js's
      file tracing is conservative. The CVE requires a crafted sigstore
      bundle input which GarfiX's runtime never processes.
