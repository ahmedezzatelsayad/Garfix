  - id: CVE-2025-64756
    status: wontfix
    severity: HIGH
    package:
      name: glob
    justification: >
      glob is used by Prisma's migration engine to scan the
      repo-bundled ./prisma/migrations directory at boot. The glob root
      and pattern are both trusted constants — user input never reaches
      glob. The CVE requires attacker-controlled glob patterns, which
      GarfiX does not accept at any endpoint.

