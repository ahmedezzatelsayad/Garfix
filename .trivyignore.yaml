  # ── minimatch — 3 HIGH ───────────────────────────────────────────────────
  # minimatch is used by Next.js's server utilities for path matching
  # during route resolution. All glob patterns come from the COMPILED route
  # table (trusted, build-time generated) — never from user input.

  - id: CVE-2026-26996
    status: wontfix
    severity: HIGH
    package:
      name: minimatch
    justification: >
      minimatch is used by Next.js's route resolver with BUILD-TIME
      generated glob patterns (the compiled route table). User input
      never reaches minimatch's pattern parser. The CVE requires
      attacker-controlled glob patterns, which GarfiX does not accept
      at any endpoint. The package.json `overrides` field forces
      minimatch ^10.0.1 at the top level; this residual finding is a
      nested transitive copy that the override doesn't reach.

  - id: CVE-2026-27903
    status: wontfix
    severity: HIGH
    package:
      name: minimatch
    justification: >
      Same as CVE-2026-26996 — minimatch patterns are build-time only,
      not user-controlled. Not exploitable via any GarfiX endpoint.

  - id: CVE-2026-27904
    status: wontfix
