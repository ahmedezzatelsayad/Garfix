# ─────────────────────────────────────────────────────────────────────────────
# Trivy ignore list — GarfiX v12.4
# ─────────────────────────────────────────────────────────────────────────────
# CVEs listed here are MANUALLY REVIEWED and accepted. Each entry has a
# justification explaining why the CVE is not exploitable in the GarfiX
# production deployment.
#
# Review cadence: re-evaluate every entry on each quarterly security review
# or whenever the base image is bumped.
#
# Context — where these CVEs actually live:
#   The GarfiX production Docker image (node:22-alpine3.21 + standalone Next.js
#   output) contains a CURATED node_modules tree produced by `next build`'s
#   output file tracing. The tracing pulls in only the modules actually
#   imported at runtime. However, some transitive build-tool dependencies
#   (tar, glob, minimatch, picomatch, brace-expansion, sigstore) get pulled
#   into the standalone output because they're imported by Prisma's runtime
#   or by Next.js's server utilities. These packages are used with
#   TRUSTED INTERNAL inputs only (file paths from the build, package
#   metadata from npm, etc.) — never with user-controlled input. The CVEs
#   below all require attacker-controlled input to the vulnerable function
#   (e.g., a crafted tar archive, a malicious glob pattern, a spoofed
#   sigstore bundle). GarfiX's runtime never calls these functions with
#   untrusted data, so the CVEs are not exploitable.
#
# The package.json `overrides` field bumps brace-expansion, minimatch, and
# related packages to the latest fixed versions at the TOP level, but
# nested transitive deps can still pin older ranges. The overrides reduce
# the count of vulnerable installations; the residual nested copies are
# accepted below.
# ─────────────────────────────────────────────────────────────────────────────

vulnerabilities:
  # ── tar — 1 CRITICAL + 8 HIGH ────────────────────────────────────────────
  # tar is used by Node.js's built-in `node:tar` polyfill and by Prisma's
  # introspection engine. At runtime, GarfiX never feeds user-controlled
  # archives to tar — the only tar operations are Prisma's internal
  # migration file handling (trusted, repo-bundled files).

  - id: CVE-2026-59873
    status: wontfix
    severity: CRITICAL
    package:
      name: tar
    justification: >
      tar is a transitive build-time dependency pulled into the standalone
      output by Prisma's migration engine. GarfiX's runtime never invokes
      tar with user-controlled input — the only tar operations are on
      trusted, repo-bundled migration files. The CVE requires a crafted
      archive input which GarfiX does not accept at any endpoint. Fix
      tracked upstream in Prisma 6.x; will be picked up on the next
      Prisma upgrade.

  - id: CVE-2026-23745
    status: wontfix
    severity: HIGH
    package:
      name: tar
    justification: >
      Same as CVE-2026-59873 — tar is only used with trusted internal
      inputs (Prisma migration files). Not exploitable via any GarfiX
      endpoint.

