server_tokens off;
# GarfiX — Nginx Production Config
# Place in: /etc/nginx/sites-available/garfix
# Symlink: /etc/nginx/sites-enabled/garfix

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name garfix.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name garfix.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/garfix.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garfix.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # P1 FIX (audit): Removed X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy — these are now set by Next.js
    # middleware (src/middleware.ts withSecurityHeaders). Keeping them in
    # both Nginx + middleware caused duplicate headers that some browsers
    # interpret unpredictably. HSTS stays in Nginx because it must be set
    # before the response reaches the app (defense-in-depth at TLS layer).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_read_timeout 120s;
    }

    location /api/e-invoicing/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-store";
        proxy_read_timeout 30s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        proxy_read_timeout 5s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Phase 10 P2: Brotli compression (15-25% smaller than gzip for Arabic text).
# Requires: apt install libnginx-mod-brotli (Ubuntu) or nginx-modules-brotli
# Uncomment after installing the module:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
