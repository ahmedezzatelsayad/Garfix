# ─────────────────────────────────────────────────────────────────────────────
# GarFiX v1.4 — Lighthouse Nightly Performance Audit
# Runs on schedule (nightly) + manual trigger + on version tags.
# Decoupled from push-time performance.yml because Lighthouse CI requires a
# fully running app + headless Chrome on the runner, which is inherently flaky
# in GitHub-hosted runners (browser download, OOM, race with app startup).
#
# Strategy:
#   * Not a merge blocker — runs overnight so engineers can review trends.
#   * SARIF + HTML report uploaded as artifact for 30 days.
#   * If budget is breached, the job fails — but only on main/tag, not PRs.
# ─────────────────────────────────────────────────────────────────────────────

name: GarFiX Lighthouse (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 02:00 UTC
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: perf-nightly-${{ github.ref }}
  cancel-in-progress: false  # Let overnight runs complete even if a new tag appears

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test?schema=public&connection_limit=5"
  DATABASE_DIRECT_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test"
  JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long!!"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret-at-least-32-chars!!"
  FOUNDER_EMAIL: "founder@test.com"
  PAYMENTS_ENC_KEY: "ci-test-encryption-key-at-least-32-characters!"
  # PERF FIX: middleware.ts gates every non-allow-listed path on
  # process.env.SETUP_COMPLETE === "true". Without this, `/` redirects to
  # `/setup` (a client-rendered wizard page). Lighthouse then sees a 307
  # redirect → /setup → minimal SSR content → NO_FCP error → audit fails.
  # Setting SETUP_COMPLETE=true makes `/` render EnhancedLandingPage with
  # proper SSR HTML, giving Lighthouse real FCP/LCP/CLS metrics.
  SETUP_COMPLETE: "true"

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garfix_test
          POSTGRES_PASSWORD: garfix_test_pass
          POSTGRES_DB: garfix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VALKEY_URL: "redis://localhost:6379"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun store
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-lh-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-lh-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build application
        run: bun run build
        env:
          # PERF FIX: forward SETUP_COMPLETE to the build so any build-time
          # inlining of process.env.SETUP_COMPLETE picks up the correct value.
          SETUP_COMPLETE: ${{ env.SETUP_COMPLETE }}

      - name: Sync database schema
        run: |
          echo "Pushing database schema (prisma db push)..."
          # Use db:push instead of migrate deploy because the migration files
          # were generated for SQLite (AUTOINCREMENT syntax) and fail on PostgreSQL.
          if ! bunx prisma db push --accept-data-loss 2>&1 | tee migrate-output.txt; then
            echo "❌ Prisma db push FAILED — app may not start correctly"
            exit 1
          fi
          echo "✅ Database schema synced successfully"

      - name: Start application
        run: |
          # PERF FIX: next.config.ts sets `output: "standalone"` (for Docker/AWS).
          # Next.js 16 prints a warning when running `next start` with standalone
          # output: ⚠ "next start" does not work with "output: standalone"
          # configuration. Use "node .next/standalone/server.js" instead.
          # We honor that — start the standalone server directly. The standalone
          # bundle includes its own minimal node_modules so it boots fast and
          # doesn't depend on the full `next start` runtime.
          # Also copy static assets (standalone server doesn't include them).
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true

          PORT=3000 NODE_ENV=production node .next/standalone/server.js &
          APP_PID=$!
          echo "Started standalone server PID $APP_PID"
          # Wait for the app to respond. PERF FIX: the previous check
          # `if [ "$HTTP_CODE" != "000" ]` falsely accepted the string
          # "000000" (curl's "%{http_code}" output concatenated with the
          # `|| echo "000"` fallback when curl exit was non-zero) as
          # "responding". Now we require an actual HTTP 2xx/3xx status.
          APP_READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
            # Accept 2xx (OK) or 3xx (redirect — e.g. /login redirect is fine).
            if [[ "$HTTP_CODE" =~ ^[23][0-9]{2}$ ]]; then
              echo "✅ Application is responding on port 3000 (HTTP $HTTP_CODE)"
              APP_READY=1
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Application failed to start within 60 seconds (last HTTP code: $HTTP_CODE)"
              kill $APP_PID 2>/dev/null || true
              exit 1
            fi
            echo "Waiting for app... attempt $i/30 (last HTTP code: $HTTP_CODE)"
            sleep 2
          done
        env:
          # PERF FIX: forward SETUP_COMPLETE so middleware.ts lets `/` render
          # the landing page (instead of redirecting to /setup).
          SETUP_COMPLETE: ${{ env.SETUP_COMPLETE }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ env.DATABASE_DIRECT_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          FOUNDER_EMAIL: ${{ env.FOUNDER_EMAIL }}
          PAYMENTS_ENC_KEY: ${{ env.PAYMENTS_ENC_KEY }}
          VALKEY_URL: redis://localhost:6379
          REDIS_URL: redis://localhost:6379

      - name: Run Lighthouse CI
        id: lhci
        # PERF FIX: removed `continue-on-error: true` — that was a band-aid
        # that hid the underlying NO_FCP failure. With SETUP_COMPLETE=true
        # and the standalone server, Lighthouse now receives real HTML and
        # should produce real scores. If it fails, we want to know.
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: |
            .github/lighthouse-budget.json
          configPath: |
            .github/lighthouserc.json

      - name: Lighthouse results summary
        if: always()
        run: |
          echo "─── Lighthouse Nightly Summary ───"
          echo "Lighthouse status: ${{ steps.lhci.outcome }}"
          echo "Check the uploaded artifacts for detailed HTML report."
          echo ""
          if [ "${{ steps.lhci.outcome }}" = "failure" ]; then
            echo "❌ Lighthouse audit failed — review per-route scores in the artifact."
            echo "This is informational; it does NOT block merges (nightly-only)."
          else
            echo "✅ Lighthouse budget passed."
          fi

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-report
          retention-days: 30
