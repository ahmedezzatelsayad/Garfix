# ─────────────────────────────────────────────────────────────────────────────
# GarFiX v1.4 — Lighthouse Nightly Performance Audit
# Runs on schedule (nightly) + manual trigger + on version tags.
# Decoupled from push-time performance.yml because Lighthouse CI requires a
# fully running app + headless Chrome on the runner, which is inherently flaky
# in GitHub-hosted runners (browser download, OOM, race with app startup).
#
# Strategy:
#   * Not a merge blocker — runs overnight so engineers can review trends.
#   * SARIF + HTML report uploaded as artifact for 30 days.
#   * If budget is breached, the job fails — but only on main/tag, not PRs.
# ─────────────────────────────────────────────────────────────────────────────

name: GarFiX Lighthouse (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"  # Every day at 02:00 UTC
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: perf-nightly-${{ github.ref }}
  cancel-in-progress: false  # Let overnight runs complete even if a new tag appears

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test?schema=public&connection_limit=5"
  DATABASE_DIRECT_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test"
  JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long!!"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret-at-least-32-chars!!"
  FOUNDER_EMAIL: "founder@test.com"
  PAYMENTS_ENC_KEY: "ci-test-encryption-key-at-least-32-characters!"

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garfix_test
          POSTGRES_PASSWORD: garfix_test_pass
          POSTGRES_DB: garfix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      VALKEY_URL: "redis://localhost:6379"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-lh-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-lh-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build application
        run: bun run build

      - name: Run Prisma migrations
        run: |
          echo "Running Prisma migrations..."
          if ! bun run db:deploy 2>&1 | tee migrate-output.txt; then
            echo "❌ Prisma migration FAILED — app may not start correctly"
            exit 1
          fi
          echo "✅ Migrations applied successfully"

      - name: Start application
        run: |
          PORT=3000 bun run start &
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ Application is responding on port 3000 (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Application failed to start within 60 seconds"
              exit 1
            fi
            echo "Waiting for app... attempt $i/30"
            sleep 2
          done

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: |
            .github/lighthouse-budget.json
          configPath: |
            .github/lighthouserc.json

      - name: Lighthouse results summary
        if: always()
        run: |
          echo "─── Lighthouse Nightly Summary ───"
          echo "Lighthouse status: ${{ steps.lhci.outcome }}"
          echo "Check the uploaded artifacts for detailed HTML report."
          echo ""
          if [ "${{ steps.lhci.outcome }}" = "failure" ]; then
            echo "❌ Budget breach detected — review per-route scores in the artifact."
            echo "This is informational; it does NOT block merges."
          else
            echo "✅ Lighthouse budget passed."
          fi
