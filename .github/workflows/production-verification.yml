name: Production Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Production Verification Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type Check
        run: bunx tsc --noEmit
        # TypeScript type errors block production deployment

      - name: ESLint (Critical/High only)
        run: |
          bun run lint 2>&1 | tee lint-output.txt
          # Count critical errors (not warnings)
          HIGH_ERRORS=$(grep -c "Cannot create components during render" lint-output.txt || echo 0)
          if [ "$HIGH_ERRORS" -gt 0 ]; then
            echo "❌ Found $HIGH_ERRORS High-severity React errors — blocking deployment"
            exit 1
          fi
          # All other lint issues are warnings — non-blocking but should be reviewed
          echo "✅ No High-severity lint errors found"
        # Only High/Critical errors block merge; warnings are advisory

      - name: Unit Tests
        run: bun test --isolate
        # All unit tests must pass

      - name: Build
        run: bun run build
        # Production build must succeed (ignoreBuildErrors removed)

      - name: README Consistency Check
        run: bun run readme-check
        # README numbers must match actual code

      - name: Smoke Test
        run: bun run scripts/smoke-test.ts
        # Critical infrastructure checks must pass

      - name: Verify OTEL env var documentation
        run: |
          # Ensure OTEL vars are documented in .env.example
          grep -q "OTEL_EXPORTER_OTLP_ENDPOINT" .env.example
          grep -q "OTEL_SERVICE_NAME" .env.example
          echo "✅ OTEL environment variables properly documented"

      - name: Verify ignoreBuildErrors is removed
        run: |
          # Ensure ignoreBuildErrors is NOT present in next.config.ts
          if grep -q "ignoreBuildErrors" next.config.ts; then
            echo "❌ ignoreBuildErrors still present in next.config.ts — blocking deployment"
            exit 1
          fi
          echo "✅ ignoreBuildErrors removed — TypeScript errors properly block build"

      - name: Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  Production Verification Checklist Summary"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✅ Type Check: bunx tsc --noEmit"
          echo "  ✅ ESLint: High-severity errors only"
          echo "  ✅ Unit Tests: bun test --isolate"
          echo "  ✅ Build: bun run build"
          echo "  ✅ README Check: bun run readme-check"
          echo "  ✅ Smoke Test: bun run scripts/smoke-test.ts"
          echo "  ✅ OTEL vars: documented in .env.example"
          echo "  ✅ ignoreBuildErrors: removed from next.config.ts"
          echo ""
          echo "  Any failure blocks merge to main."
          echo "════════════════════════════════════════════════════════════"
