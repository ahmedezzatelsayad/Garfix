name: Production Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Production Verification Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type Check
        run: bunx tsc --noEmit
        # TypeScript type errors block production deployment

      - name: ESLint
        run: |
          # Run lint on production code only (same scope as CI)
          set +e
          set +o pipefail
          bunx eslint src/app src/lib src/modules 2>&1 | tee lint-output.txt
          ESLINT_EXIT=${PIPESTATUS[0]}
          set -e
          set -o pipefail
          if [ $ESLINT_EXIT -ne 0 ]; then
            echo "❌ ESLint found errors — blocking deployment"
            exit 1
          fi
          echo "✅ ESLint passed — no errors"

      - name: Unit Tests
        run: |
          echo "Running core unit tests (same scope as CI)..."
          PASS=true
          bun test src/lib/__tests__/secretsManager.test.ts 2>&1 || PASS=false
          bun test src/lib/__tests__/rateLimit-advanced.test.ts 2>&1 || PASS=false
          bun test src/lib/__tests__/cryptoVault-advanced.test.ts 2>&1 || PASS=false
          bun test src/lib/founder-validation/__tests__/load-test-1000.test.ts 2>&1 || PASS=false
          bun test src/lib/founder-validation/__tests__/scale-invoice-items-12.test.ts 2>&1 || PASS=false
          if [ "$PASS" = "false" ]; then
            echo "❌ Some unit tests failed"
            exit 1
          fi
          echo "✅ All unit tests passed"

      - name: Build
        run: bun run build
        # Production build must succeed (ignoreBuildErrors removed)

      - name: README Consistency Check
        run: bun run readme-check
        # README numbers must match actual code

      - name: Smoke Test
        run: bun run scripts/smoke-test.ts
        # Critical infrastructure checks must pass

      - name: Verify OTEL env var documentation
        run: |
          # Ensure OTEL vars are documented in .env.example
          grep -q "OTEL_EXPORTER_OTLP_ENDPOINT" .env.example
          grep -q "OTEL_SERVICE_NAME" .env.example
          echo "✅ OTEL environment variables properly documented"

      - name: Verify ignoreBuildErrors is removed
        run: |
          # Ensure ignoreBuildErrors is NOT present in next.config.ts
          if grep -q "ignoreBuildErrors" next.config.ts; then
            echo "❌ ignoreBuildErrors still present in next.config.ts — blocking deployment"
            exit 1
          fi
          echo "✅ ignoreBuildErrors removed — TypeScript errors properly block build"

      - name: Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  Production Verification Checklist Summary"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✅ Type Check: bunx tsc --noEmit"
          echo "  ✅ ESLint: production code (src/app, src/lib, src/modules)"
          echo "  ✅ Unit Tests: core modules (same scope as CI)"
          echo "  ✅ Build: bun run build"
          echo "  ✅ README Check: bun run readme-check"
          echo "  ✅ Smoke Test: bun run scripts/smoke-test.ts"
          echo "  ✅ OTEL vars: documented in .env.example"
          echo "  ✅ ignoreBuildErrors: removed from next.config.ts"
          echo ""
          echo "  Any failure blocks merge to main."
          echo "════════════════════════════════════════════════════════════"
