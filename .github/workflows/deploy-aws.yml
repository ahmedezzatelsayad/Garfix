name: Deploy to AWS EC2
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to deploy"
        required: false
        default: "main"
  release:
    types: [published]
concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Build Docker image
        run: |
          docker build -t garfix:${{ github.sha }} .
          docker tag garfix:${{ github.sha }} garfix:latest
      - name: Save image
        run: docker save garfix:${{ github.sha }} | gzip > /tmp/garfix.tar.gz
      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: /tmp/garfix.tar.gz
          target: /home/ubuntu/
          strip_components: 1
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/Garfix
            git fetch --all
            git checkout --force ${{ github.event.inputs.ref || github.sha || 'main' }}
            docker load < /home/ubuntu/garfix.tar.gz
            rm /home/ubuntu/garfix.tar.gz
            CURRENT=$(docker ps --filter "name=garfix-app" --format '{{.Image}}' | head -1 || echo "")
            if [ -n "$CURRENT" ]; then docker tag "$CURRENT" garfix:previous || true; fi
            ./scripts/fetch-secrets.sh
            export GARFIX_IMAGE_TAG=garfix:${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --no-build
            for i in $(seq 1 30); do
              H=$(curl -sf http://localhost:3000/api/health 2>/dev/null | jq -r '.status' 2>/dev/null || echo "failed")
              if [ "$H" = "ok" ]; then echo "Deploy OK"; docker image prune -f; exit 0; fi
              sleep 2
            done
            if docker image inspect garfix:previous >/dev/null 2>&1; then
              export GARFIX_IMAGE_TAG=garfix:previous
              docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --no-build
            fi
            exit 1
      - name: Notify on failure
        if: failure()
        uses: aws-actions/aws-sns-publish@v2.0.0
        with:
          topic-arn: ${{ secrets.SNS_TOPIC_ARN }}
          message: "GarfiX deploy FAILED on ${{ github.sha }}"
          subject: "GarfiX Deploy Failed"
