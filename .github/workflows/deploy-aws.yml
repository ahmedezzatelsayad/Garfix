name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Docker image
        run: docker build -t garfix:${{ github.sha }} .

      - name: Save image
        run: docker save garfix:${{ github.sha }} | gzip > /tmp/garfix.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: /tmp/garfix.tar.gz
          target: /home/ubuntu/
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Garfix
            git pull origin main

            # Load new image
            docker load < /home/ubuntu/garfix.tar.gz
            rm /home/ubuntu/garfix.tar.gz

            # Fetch secrets from SSM (no printing)
            ./scripts/fetch-secrets.sh

            # Deploy
            docker compose -f docker-compose.prod.yml up -d --build

            # Wait for health check
            sleep 15
            HEALTH=$(curl -sf http://localhost:3000/api/health | jq -r '.status' 2>/dev/null || echo "failed")

            if [ "$HEALTH" != "ok" ]; then
              echo "❌ Health check failed: $HEALTH"
              echo "Rolling back..."
              docker compose -f docker-compose.prod.yml restart app
              sleep 10
              HEALTH_RETRY=$(curl -sf http://localhost:3000/api/health | jq -r '.status' 2>/dev/null || echo "failed")
              if [ "$HEALTH_RETRY" != "ok" ]; then
                echo "❌ Rollback also failed — manual intervention required"
                exit 1
              fi
              echo "⚠️ Rolled back successfully (previous container)"
            else
              echo "✅ Deploy successful — health check passed"
            fi

            # Cleanup old images
            docker image prune -f

      - name: Notify on failure
        if: failure()
        uses: aws-actions/aws-sns-publish@v1
        with:
          topic-arn: ${{ secrets.SNS_TOPIC_ARN }}
          message: "GarfiX deployment FAILED on commit ${{ github.sha }}"
          subject: "❌ GarfiX Deploy Failed"
