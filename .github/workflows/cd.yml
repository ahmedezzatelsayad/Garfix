# ─────────────────────────────────────────────────────────────────────────────
# GarfiX v1.5 — Continuous Deployment Pipeline
# Triggers on release publish, push to main, or manual dispatch
# Jobs: build-image → docker-smoke-test → deploy-staging → deploy-production
#
# v1.5 CHANGELOG:
#   * Removed redundant host-level `bun run build` — the Dockerfile already
#     builds inside the image. Running it twice wasted CI minutes and could
#     mask Dockerfile build failures (host build would pass while Docker
#     build would fail).
#   * Added `docker-smoke-test` job: builds the image, starts it in a
#     container, curls /api/health, fails the pipeline if HTTP != 200.
#     This is the user-requested "Smoke Test inside Docker itself".
#   * Dockerfile builder stage switched to Node.js (v12.3) — eliminates
#     the SIGILL that was previously blocking this pipeline on GHA.
# ─────────────────────────────────────────────────────────────────────────────

name: GarfiX CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/performance.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/pr-checks.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version to deploy (e.g. v1.4)"
        required: false
        type: string

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Build-time environment variables (not secrets — just needed for `next build`)
  # These are CI-only values; production secrets come from the deployment environment.
  DATABASE_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test?schema=public"
  DATABASE_DIRECT_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test"
  JWT_SECRET: "j16Zoo6iiO7xSg78tBzHVjog6jkzsOMBjOShkHWxn2zVGS3u"
  JWT_REFRESH_SECRET: "NObYh3hZlRzsw924JkX1T19kPaQbp2xVsKv3EzVSDEpwKeKU"
  FOUNDER_EMAIL: "founder@test.com"
  PAYMENTS_ENC_KEY: "W3ev2LxdaXategyvcNiDpmFt2xhHlL6c2R8j0K22"
  NODE_ENV: "test"

jobs:
  # ── Job 1: Build Docker Image ──────────────────────────────────────────
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=test
            DATABASE_URL=${{ env.DATABASE_URL }}
            DATABASE_DIRECT_URL=${{ env.DATABASE_DIRECT_URL }}
            JWT_SECRET=${{ env.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET }}
            FOUNDER_EMAIL=${{ env.FOUNDER_EMAIL }}
            PAYMENTS_ENC_KEY=${{ env.PAYMENTS_ENC_KEY }}

      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

      - name: Verify Docker image built successfully
        run: |
          echo "─── Docker Image Verification ───"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "✅ Docker image built and pushed successfully"
          echo "ℹ️ Runtime smoke test runs in the next job (docker-smoke-test)"

  # ── Job 2: Docker Smoke Test (inside the built image) ──────────────────
  # v1.5: Pulls the just-pushed image, starts it, curls /api/health.
  # This catches runtime issues that a successful `docker build` cannot
  # detect (missing runtime deps, broken server.js, env var typos, etc.).
  docker-smoke-test:
    name: 🧪 Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-image]
    if: always() && needs.build-image.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: img
        run: |
          # Prefer SHA-tagged image, fall back to :main
          TAG="sha-${GITHUB_SHA::7}"
          if ! docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG 2>/dev/null; then
            echo "⚠️ SHA tag not found, falling back to :main"
            TAG="main"
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Run smoke test inside Docker container
        env:
          IMAGE: ${{ steps.img.outputs.full }}
          # Minimal runtime env — the image's HEALTHCHECK will hit /api/health
          # internally, but we also curl from the host for a stronger check.
          DATABASE_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test?schema=public"
          DATABASE_DIRECT_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test"
          JWT_SECRET: "smoke-test-jwt-secret-at-least-32-characters-long!!"
          JWT_REFRESH_SECRET: "smoke-test-refresh-secret-at-least-32-chars!!"
          FOUNDER_EMAIL: "founder@test.com"
          PAYMENTS_ENC_KEY: "smoke-test-encryption-key-at-least-32-chars!"
          NODE_ENV: "production"
        run: |
          echo "─── Docker Smoke Test ───"
          echo "Image: $IMAGE"
          echo ""

          # Start the container detached
          docker run --rm -d \
            --name garfix-smoke \
            -p 3001:3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DATABASE_DIRECT_URL="$DATABASE_DIRECT_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e FOUNDER_EMAIL="$FOUNDER_EMAIL" \
            -e PAYMENTS_ENC_KEY="$PAYMENTS_ENC_KEY" \
            -e NODE_ENV="$NODE_ENV" \
            "$IMAGE"

          echo "✅ Container started, waiting for it to become healthy..."

          # Wait for the container's HEALTHCHECK to report healthy (max 60s)
          HEALTHY=false
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' garfix-smoke 2>/dev/null || echo "none")
            echo "  Attempt $i/30 — health: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Container became unhealthy before becoming healthy"
              docker logs garfix-smoke 2>&1 | tail -50
              exit 1
            fi
            sleep 2
          done

          if [ "$HEALTHY" = "false" ]; then
            echo "❌ Container did not become healthy within 60 seconds"
            docker logs garfix-smoke 2>&1 | tail -80
            exit 1
          fi

          echo "✅ Container is healthy"
          echo ""

          # Hit /api/health from the host (port 3001) for an end-to-end check
          echo "─── Curl /api/health from host ───"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3001/api/health 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ /api/health returned HTTP 200"
          else
            echo "❌ /api/health returned HTTP $HTTP_CODE (expected 200)"
            docker logs garfix-smoke 2>&1 | tail -80
            exit 1
          fi

          # Also fetch the body to verify it's valid JSON with status:ok
          BODY=$(curl -sf http://localhost:3001/api/health 2>/dev/null || echo "")
          echo "   Body: $BODY"
          if echo "$BODY" | grep -q '"status"'; then
            echo "✅ Health response body is valid"
          else
            echo "⚠️ Health response body is missing 'status' field"
          fi

          echo ""
          echo "✅ Docker smoke test PASSED"

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker stop garfix-smoke 2>/dev/null || true
          docker rm garfix-smoke 2>/dev/null || true

      - name: Upload smoke test logs on failure
        if: failure()
        run: |
          docker logs garfix-smoke 2>&1 > smoke-test-logs.txt || echo "(no logs available)" > smoke-test-logs.txt
          echo "Smoke test logs saved to smoke-test-logs.txt"

      - name: Upload smoke test logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-test-logs
          path: smoke-test-logs.txt
          retention-days: 14
          if-no-files-found: ignore

  # ── Job 3: Deploy to Staging ───────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-image, docker-smoke-test]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') ||
      github.event_name == 'release' ||
      github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.garfix.io
    timeout-minutes: 15

    steps:
      - name: Deploy to staging
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║       GarFiX — Deploying to Staging              ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Image: ${{ needs.build-image.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-image.outputs.image-digest }}"
          echo "Version: ${{ inputs.version || github.ref_name }}"
          echo ""
          echo "✅ Staging deployment initiated"
          echo "⚠️ Configure your deployment target (SSH, k8s, etc.) in this step"

      - name: Run smoke tests
        run: |
          echo "─── Running Smoke Tests ───"
          # Smoke test 1: Health endpoint
          if [ -n "$STAGING_URL" ]; then
            echo "Testing health endpoint at $STAGING_URL/api/health..."
            # Retry up to 5 times with 10s interval for staging to become ready
            HTTP_CODE="000"
            for i in 1 2 3 4 5; do
              HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                break
              fi
              echo "Attempt $i/5 - got HTTP $HTTP_CODE, retrying in 10s..."
              sleep 10
            done
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Staging health check failed after 5 attempts (last HTTP $HTTP_CODE)"
              echo "Failing deployment — staging is not healthy"
              exit 1
            fi
          else
            echo "ℹ️ STAGING_URL not configured — skipping live smoke test"
            echo "Configure STAGING_URL secret in the staging environment for live health checks"
            echo "⚠️ Without STAGING_URL, smoke tests are SKIPPED — deployment is NOT verified"
          fi
          echo ""
          echo "✅ Smoke tests completed"

  # ── Job 4: Deploy to Production ────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-image, docker-smoke-test, deploy-staging]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') ||
      (github.event_name == 'release' && needs.deploy-staging.result == 'success')
    environment:
      name: production
      url: https://garfix.io
    timeout-minutes: 20

    steps:
      - name: Deploy to production
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║      GarFiX — Deploying to Production            ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Image: ${{ needs.build-image.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-image.outputs.image-digest }}"
          echo "Version: ${{ inputs.version || github.ref_name }}"
          echo ""
          echo "✅ Production deployment initiated"
          echo "⚠️ Configure your deployment target (SSH, k8s, etc.) in this step"

      - name: Run production health check
        run: |
          echo "─── Production Health Check ───"
          # Health check with retry logic
          if [ -n "$PRODUCTION_URL" ]; then
            echo "Testing health endpoint at $PRODUCTION_URL/api/health..."
            for i in 1 2 3 4 5; do
              HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/health" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                break
              fi
              echo "Attempt $i/5 - got HTTP $HTTP_CODE, retrying in 10s..."
              sleep 10
            done
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Production health check failed after 5 attempts"
              exit 1
            fi
          else
            echo "ℹ️ PRODUCTION_URL not configured — skipping live health check"
            echo "Configure PRODUCTION_URL secret in the production environment for live health checks"
          fi
          echo ""
          echo "✅ Production health check completed"

  # ── Job 5: Deployment Summary ──────────────────────────────────────────
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-image, docker-smoke-test, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║        GarFiX v1.5 Deployment Summary            ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Image Build:      ${{ needs.build-image.result }}"
          echo "Smoke Test:       ${{ needs.docker-smoke-test.result }}"
          echo "Staging Deploy:   ${{ needs.deploy-staging.result }}"
          echo "Production Deploy: ${{ needs.deploy-production.result }}"
          echo ""
          echo "Version: ${{ inputs.version || github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"

      - name: Fail if image build failed
        if: needs.build-image.result == 'failure'
        run: |
          echo "❌ Docker image build failed — deployment aborted"
          exit 1

      - name: Fail if smoke test failed
        if: needs.docker-smoke-test.result == 'failure'
        run: |
          echo "❌ Docker smoke test failed — image is not healthy, deployment aborted"
          exit 1
