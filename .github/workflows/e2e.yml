# ═════════════════════════════════════════════════════════════
# GarfiX — E2E Tests (Playwright) with PostgreSQL + Valkey
# ═════════════════════════════════════════════════════════════
# Runs Playwright E2E suite against a real app instance with:
#   - PostgreSQL 17 (real DB, not mock)
#   - Valkey 8.1 (real cache/queue, not in-memory fallback)
#   - DeepSeek API (placeholder key — AI tests will mock at HTTP level)
#
# Triggers:
#   - On PR to main/develop (gate before merge)
#   - On push to main (verify after merge)
#   - Manual dispatch (for debugging)
# ═════════════════════════════════════════════════════════════

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test?schema=public&connection_limit=5"
  DATABASE_DIRECT_URL: "postgresql://garfix_test:garfix_test_pass@localhost:5432/garfix_test"
  VALKEY_URL: "valkey://localhost:6379"
  JWT_SECRET: "e2e-test-jwt-secret-at-least-32-characters-long!!"
  JWT_REFRESH_SECRET: "e2e-test-refresh-secret-at-least-32-chars!!"
  FOUNDER_EMAIL: "founder@garfix.app"
  FOUNDER_PASSWORD: "E2eTestPassword2026!"
  PAYMENTS_ENC_KEY: "e2e-test-encryption-key-at-least-32-characters!"
  DEEPSEEK_API_KEY: "sk-e2e-test-placeholder"
  DEEPSEEK_MODEL: "deepseek-chat"
  APP_URL: "http://localhost:3000"

jobs:
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: garfix_test
          POSTGRES_PASSWORD: garfix_test_pass
          POSTGRES_DB: garfix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 15); do
            if pg_isready -h localhost -p 5432 -U garfix_test 2>/dev/null; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 2
          done

      - name: Wait for Valkey
        run: |
          echo "Waiting for Valkey..."
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/localhost/6379) 2>/dev/null; then
              echo "✅ Valkey is ready"
              break
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 2
          done

      - name: Sync database schema
        run: |
          echo "Pushing database schema..."
          bunx prisma migrate deploy

      - name: Seed test database
        run: |
          echo "Seeding test data..."
          bunx prisma db seed 2>&1 || echo "Seed completed with warnings"
        continue-on-error: true

      - name: Build application
        run: bun run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          FOUNDER_EMAIL: ${{ env.FOUNDER_EMAIL }}

      - name: Start application
        run: |
          bun run start &
          echo $! > /tmp/app.pid
          echo "Started app PID $(cat /tmp/app.pid)"
          # Wait for health check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health 2>/dev/null; then
              echo "✅ App ready after ${i}s"
              break
            fi
            echo "Waiting for app... attempt $i/30"
            sleep 2
          done

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          echo "Running E2E tests..."
          bunx playwright test --config=playwright.e2e.config.ts --reporter=github 2>&1 | tee e2e-results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ E2E tests failed — review e2e-results.txt"
            exit 1
          else
            echo "✅ All E2E tests passed"
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill $(cat /tmp/app.pid) 2>/dev/null || true
          fi

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.txt
            playwright-report/
            test-results/
          retention-days: 14
