# ─────────────────────────────────────────────────────────────────────────────
# GarFiX — PR Validation Pipeline
# Fast checks on every PR to main — lightweight gate before full CI
# Runs: lint, typecheck, build verification (no tests — CI handles those)
# ─────────────────────────────────────────────────────────────────────────────

name: GarFiX PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # NOTE: DATABASE_URL / DATABASE_DIRECT_URL are NOT set here — the committed
  # `.env` file provides the real Neon PostgreSQL connection string, which
  # `next start` loads automatically. Setting dummy localhost values here
  # would override .env and break the smoke test.
  JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long!!"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret-at-least-32-chars!!"
  FOUNDER_EMAIL: "founder@test.com"
  PAYMENTS_ENC_KEY: "ci-test-encryption-key-at-least-32-characters!"
  COMMIT_SHA: ${{ github.sha }}

jobs:
  # ── Quick Lint ────────────────────────────────────────────────────────
  quick-lint:
    name: 🔍 Quick Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: |
          # Capture exit code properly without pipefail clobbering it
          # NOTE: ESLint 9 removed --format=compact from core; use default stylish format
          set +e
          set +o pipefail
          bunx eslint src/app src/lib src/modules 2>&1 | tee lint-results.txt
          ESLINT_EXIT=${PIPESTATUS[0]}
          set -e
          set -o pipefail

          if [ $ESLINT_EXIT -ne 0 ]; then
            echo "❌ ESLint found errors — check lint-results.txt"
            exit 1
          else
            echo "✅ ESLint passed — no errors"
          fi

  # ── Quick TypeCheck ──────────────────────────────────────────────────
  quick-typecheck:
    name: 📝 Quick TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: TypeScript type check
        run: |
          if [ ! -f tsconfig.prod.json ]; then
            echo '{"extends": "./tsconfig.json", "exclude": ["**/__tests__/**", "**/*.test.ts", "**/*.spec.ts", "**/node_modules/**"]}' > tsconfig.prod.json
          fi

          set +e
          set +o pipefail
          bunx tsc --noEmit -p tsconfig.prod.json 2>&1 | tee typecheck-results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          set -o pipefail

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Type errors found!"
            exit 1
          else
            echo "✅ No type errors"
          fi

  # ── Quick Build ──────────────────────────────────────────────────────
  quick-build:
    name: 🏗️ Quick Build + Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quick-lint, quick-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build application
        run: |
          set +e
          set +o pipefail
          bun run build 2>&1 | tee build-results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          set -o pipefail

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed!"
            exit 1
          else
            echo "✅ Build successful"
          fi

      - name: Verify build output
        run: |
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "❌ .next/BUILD_ID missing — build is broken"
            exit 1
          fi
          if [ ! -f ".next/required-server-files.js" ]; then
            echo "❌ .next/required-server-files.js missing — cannot run 'next start'"
            exit 1
          fi
          echo "✅ Standard Next.js output verified (BUILD_ID: $(cat .next/BUILD_ID))"

      - name: Smoke test — start server + curl /api/health
        run: |
          set +e
          # Start server in background. PORT=3100 to avoid conflicts.
          PORT=3100 bun run start > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"

          # Wait for server to be ready (max 30s)
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/api/health | grep -q "200\|503"; then
              echo "✅ Server responded after ${i}s"
              break
            fi
            sleep 1
          done

          # Capture health endpoint response
          HEALTH_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" http://localhost:3100/api/health)
          echo "═══ /api/health response ═══"
          echo "$HEALTH_RESPONSE"
          echo "════════════════════════════"

          # Verify health endpoint returns 200 (DB connected, queue tier available)
          HTTP_STATUS=$(echo "$HEALTH_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ /api/health returned $HTTP_STATUS (expected 200)"
            echo "═══ server.log (last 50 lines) ═══"
            tail -50 server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify response contains commitSha (proves build-time injection works)
          if ! echo "$HEALTH_RESPONSE" | grep -q "commitSha"; then
            echo "❌ /api/health missing commitSha field — build-time env injection failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify home page returns 200
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/)
          if [ "$HOME_STATUS" != "200" ]; then
            echo "❌ Home page returned $HOME_STATUS (expected 200)"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "✅ All smoke tests passed"
          kill $SERVER_PID 2>/dev/null || true
          # Give server time to clean up
          sleep 2
          set -e

  # ── PR Summary ───────────────────────────────────────────────────────
  pr-summary:
    name: 📋 PR Check Summary
    runs-on: ubuntu-latest
    needs: [quick-lint, quick-typecheck, quick-build]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║        GarFiX PR Check Summary                  ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Lint:       ${{ needs.quick-lint.result }}"
          echo "TypeCheck:  ${{ needs.quick-typecheck.result }}"
          echo "Build:      ${{ needs.quick-build.result }}"
          echo ""

          if echo "${{ needs.quick-typecheck.result }}${{ needs.quick-build.result }}" | grep -q "failure"; then
            echo "❌ PR checks FAILED"
            exit 1
          fi

          echo "✅ PR checks PASSED — ready for review"
